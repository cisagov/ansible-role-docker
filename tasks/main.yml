---
- name: Load setup tasks file for adding the official Docker repo
  ansible.builtin.include_tasks:
    file: "{{ lookup('first_found', params) }}"
  vars:
    params:
      files:
        - "setup_{{ ansible_distribution }}_{{ ansible_distribution_release }}.yml"
        - "setup_{{ ansible_distribution }}.yml"
        - "setup_{{ ansible_os_family }}.yml"
      paths:
        - "{{ role_path }}/tasks"
  when:
    # Note that we only need to do this for all Debian-based OSs and
    # Fedora.
    - ansible_os_family == "Debian" or ansible_distribution == "Fedora"

- name: Load var file with package names based on the OS type
  ansible.builtin.include_vars:
    file: "{{ lookup('first_found', params) }}"
  vars:
    params:
      files:
        - "{{ ansible_distribution }}_{{ ansible_distribution_release }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
      paths:
        - "{{ role_path }}/vars"

- name: >
    Install Docker, Docker Compose, and the Docker Python library
  ansible.builtin.package:
    name: "{{ docker_prerequisites }}"

# Amazon Linux 2023 does not (yet?) offer docker-compose or the
# Docker Compose plugin, so we grab it from GitHub:
# https://github.com/amazonlinux/amazon-linux-2023/issues/186
- name: Install Docker Compose V2 plugin (Amazon Linux)
  ansible.builtin.include_tasks:
    file: compose_Amazon.yml
  when:
    - ansible_distribution == "Amazon"

# Unless you do this, systemd can sometimes get confused when you try
# to start a service you just installed
- name: Systemd daemon-reload
  ansible.builtin.systemd:
    daemon_reload: true
  when: ansible_service_mgr == "systemd"

- name: Enable docker
  ansible.builtin.service:
    name: docker
    enabled: true
